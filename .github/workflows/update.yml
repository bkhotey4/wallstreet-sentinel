name: 更新情報站

on:
  schedule:
    - cron: "7 * * * 1-5"        # 平日每小時
    - cron: "7 */4 * * 0,6"      # 週末每 4 小時
  push:                          # 推送新程式後立刻重建，不必等排程
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      no_ai:
        description: "跳過 AI 研判（省 API 額度）"
        type: boolean
        default: false

concurrency:
  group: intel-station
  cancel-in-progress: true

permissions:
  contents: write        # 只用來把每日快照（時光機）推到 data 分支；main 分支不會被 Actions 改動
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-site.txt

      - run: pip install -r requirements-site.txt

      # 歷史價格、FRED 檔案庫、暗池指數與資料庫快取：失敗時也照樣存，避免下次重抓 30 年資料
      - name: 還原資料快取
        uses: actions/cache/restore@v4
        with:
          path: |
            data_cache/history_close.pkl
            data_cache/fred_series.pkl
            data_cache/darkpool.json
            data_cache/darkpool_meta.json
            data_cache/sentinel.db
            data_cache/stock_prices.pkl
            data_cache/stock_news.json
            data_cache/stockscore_hist.json
            data_cache/signals_seen.json
            data_cache/twse_t86.json
            data_cache/gurus.json
            data_cache/insiders.json
            data_cache/sec_tickers.json
            data_cache/treasury_auctions.json
          key: data-${{ github.run_id }}
          restore-keys: data-

      # 時光機：每日快照存在獨立的 data 分支（不存在就自動建立），不會碰到 main 分支的程式
      - name: 取出快照分支
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _data && cd _data && git init -q -b data
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch -q --depth=1 origin data && git checkout -q -B data FETCH_HEAD || echo "data 分支尚未建立，第一次快照時建立"
          mkdir -p snap

      - name: 產生網站
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ "${{ inputs.no_ai }}" = "true" ]; then FLAG="--no-ai"; fi
          python -m tools.build_site --out site --snapdir _data/snap $FLAG

      - name: 儲存新快照
        if: success()
        run: |
          cd _data
          git config user.name "intel-station-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snap
          if git diff --cached --quiet; then echo "今天的快照已存在，略過"; exit 0; fi
          git commit -q -m "快照 $(date -u +%F)"
          git push -q origin data || echo "快照推送失敗（下次執行會再試）"

      - name: 儲存資料快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data_cache/history_close.pkl
            data_cache/fred_series.pkl
            data_cache/darkpool.json
            data_cache/darkpool_meta.json
            data_cache/sentinel.db
            data_cache/stock_prices.pkl
            data_cache/stock_news.json
            data_cache/stockscore_hist.json
            data_cache/signals_seen.json
            data_cache/twse_t86.json
            data_cache/gurus.json
            data_cache/insiders.json
            data_cache/sec_tickers.json
            data_cache/treasury_auctions.json
          key: data-${{ github.run_id }}

      # 只檢查「持倉區塊才會出現」的標記，避免 AI 評論或新聞裡的一般用詞（例如「未實現」）誤判
      - name: 確認輸出不含持倉
        run: |
          test -s site/index.html
          ! grep -Eq "## 使用者持倉|持倉總值|未實現損益|data-private" site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 公開倉庫連續 60 天沒有活動時，GitHub 會自動停用排程；每次執行順便重新啟用，避免悄悄停擺
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" || true
