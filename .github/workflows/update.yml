name: 更新情報站

on:
  schedule:
    - cron: "37 * * * 1-5"       # 平日每小時備援（主要排程是 bot 每 20 分鐘觸發；GitHub 排程尖峰時常延遲或略過）
    - cron: "7 */4 * * 0,6"      # 週末每 4 小時
  push:                          # 推送新程式後立刻重建，不必等排程
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      no_ai:
        description: "跳過 AI 研判（省 API 額度）"
        type: boolean
        default: false
      fast:
        description: "快速建置：跳過全市場掃描（沿用快取的個股資料），約 5 分鐘"
        type: boolean
        default: false

concurrency:
  group: intel-station
  cancel-in-progress: false     # a running build always finishes; newer requests wait (only the latest waiting one is kept)

permissions:
  contents: read         # 快照改存私有快取，Actions 不再寫入 repo
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}   # step 的 if 不能直接讀 secrets，先轉成旗標
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-site.txt

      - run: pip install -r requirements-site.txt

      # 歷史價格、FRED 檔案庫、暗池指數與資料庫快取：建置失敗時也照樣存（被取消的不存，避免寫到一半的檔），避免下次重抓 30 年資料
      - name: 還原資料快取
        uses: actions/cache/restore@v4
        with:
          path: |
            data_cache/history_close.pkl
            data_cache/history_fail.json
            data_cache/fred_series.pkl
            data_cache/darkpool.json
            data_cache/darkpool_meta.json
            data_cache/sentinel.db
            data_cache/stock_prices.pkl
            data_cache/stock_news.json
            data_cache/stockscore_hist.json
            data_cache/signals_seen.json
            data_cache/signal_ledger.json
            data_cache/sec_segments.json
            data_cache/snap
            data_cache/twse_t86.json
            data_cache/gurus.json
            data_cache/insiders.json
            data_cache/sec_tickers.json
            data_cache/treasury_auctions.json
            data_cache/fullmarket_*
            data_cache/econ_*
            data_cache/earn_*
            data_cache/sinfo_*
            data_cache/growth_*
          key: data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: data-

      # 時光機：每日快照存在 GitHub Actions 的私有快取（不放在公開 repo）。第一次執行時從舊的 data 分支搬一次
      - name: 準備快照資料夾
        run: |
          mkdir -p data_cache/snap
          if [ -z "$(ls -A data_cache/snap 2>/dev/null)" ]; then
            git fetch -q --depth=1 origin data 2>/dev/null && git archive FETCH_HEAD snap | tar -x -C data_cache && echo "已從舊 data 分支搬入 $(ls data_cache/snap | wc -l) 份快照" || echo "沒有舊快照可搬"
          fi

      - name: 產生網站
        env:
          WSS_FIREBASE_CONFIG: ${{ vars.WSS_FIREBASE_CONFIG }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          if [ "${{ inputs.no_ai }}" = "true" ]; then FLAG="--no-ai"; fi
          FM="--fullmarket"; if [ "${{ inputs.fast }}" = "true" ]; then FM=""; fi
          python -m tools.build_site --out site --snapdir data_cache/snap $FM $FLAG

      - name: 儲存資料快取
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: |
            data_cache/history_close.pkl
            data_cache/history_fail.json
            data_cache/fred_series.pkl
            data_cache/darkpool.json
            data_cache/darkpool_meta.json
            data_cache/sentinel.db
            data_cache/stock_prices.pkl
            data_cache/stock_news.json
            data_cache/stockscore_hist.json
            data_cache/signals_seen.json
            data_cache/signal_ledger.json
            data_cache/sec_segments.json
            data_cache/snap
            data_cache/twse_t86.json
            data_cache/gurus.json
            data_cache/insiders.json
            data_cache/sec_tickers.json
            data_cache/treasury_auctions.json
            data_cache/fullmarket_*
            data_cache/econ_*
            data_cache/earn_*
            data_cache/sinfo_*
            data_cache/growth_*
          key: data-${{ github.run_id }}-${{ github.run_attempt }}

      # 只檢查「持倉區塊才會出現」的標記，避免 AI 評論或新聞裡的一般用詞（例如「未實現」）誤判
      - name: 確認輸出不含持倉
        run: |
          test -s site/index.html
          # same strict check; on a hit, print WHAT matched so the cause is visible in the log
          if grep -Eo ".{0,80}(## 使用者持倉|持倉總值|未實現損益|data-private).{0,40}" site/index.html; then
            echo "::error::output contains holdings-like text (matches printed above)"; exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # 同一份網站也發布到 Cloudflare Pages（並行試用，GitHub Pages 照舊）。只有在 repo Secrets 設好
      # CLOUDFLARE_API_TOKEN（權限：Account › Cloudflare Pages › Edit）與 CLOUDFLARE_ACCOUNT_ID 時才執行；
      # 失敗也不影響 GitHub Pages 的部署。
      - name: 發布到 Cloudflare Pages（試用）
        if: ${{ env.HAS_CF == 'true' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node tests_js/quote.test.mjs        # functions/api/quote.js = 即時報價（行情列、盤中門檻、查任何股票）
          # Cloudflare 版用青綠底＋「即時」圖示與名稱，手機主畫面上和 GitHub 版（黑底）分得開；GitHub 版的檔案上面已打包，不受影響
          cp tools/static/cf/*.png site/
          python - <<'EOF'
          import json
          p = "site/manifest.webmanifest"
          m = json.load(open(p, encoding="utf-8"))
          m.update(name="WallStreet Sentinel 情報站（即時版）", short_name="情報站即時", theme_color="#0d6e68")
          json.dump(m, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          EOF
          sed -i 's/content="#0a0b0d"/content="#0d6e68"/' site/index.html
          npx --yes wrangler@3.114.0 pages project create wallstreet-sentinel --production-branch=main >/dev/null 2>&1 || true
          npx --yes wrangler@3.114.0 pages deploy site --project-name=wallstreet-sentinel --branch=main --commit-dirty=true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 公開倉庫連續 60 天沒有活動時，GitHub 會自動停用排程；每次執行順便重新啟用，避免悄悄停擺
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" || true
