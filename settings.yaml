# =====================================================================
#  WallStreet Sentinel — 全域設定檔
#  所有「追蹤標的 / 權重 / 更新頻率 / 警報門檻 / 排程」都在這裡調整，
#  程式碼裡不寫死任何市場數字。所有數值一律來自即時資料源。
# =====================================================================

timezone: Asia/Taipei

# ---------- 更新頻率（秒） ----------
refresh:
  quotes: 120          # 全球即時報價（股/債/匯/商品/加密/波動率）
  history_hours: 8     # 長期日線歷史重建（壓力指數/崩盤機率用）
  fred: 3600           # 聯準會 FRED 總經/信用/流動性
  crypto: 300
  news: 300
  options_gamma: 900   # CBOE SPX 選擇權 gamma
  sec: 1800            # SEC EDGAR 持股公告
  calendar: 21600

history_start: "1995-01-01"   # 固定歷史起點：行情資料自 1995 起（1997 亞洲風暴、2000 泡沫、2008 海嘯的資產表現都在）；壓力指數因指標不足約 2001 年後才有數值
history_years: 20      # 只有在沒設 history_start 時才用（滾動視窗）

# ---------- 全球監控宇宙（Yahoo Finance 代號） ----------
universe:
  us_equity:
