# 新聞風險關鍵字權重（英文不分大小寫）
news_keywords:
  default: 4
  bankruptcy: 4
  chapter 11: 4
  bank run: 5
  contagion: 4
  liquidity crisis: 5
  margin call: 4
  downgrade: 3
  emergency: 3
  circuit breaker: 5
  trading halt: 4
  intervention: 3
  sanctions: 2
  missile: 3
  invasion: 5
  blockade: 5
  taiwan strait: 4
  tariff: 2
  recession: 2
  selloff: 2
  sell-off: 2
  plunge: 2
  crash: 3
  rate cut: 1
  rate hike: 2
  inflation: 1
  private credit: 3
  redemption: 2
  gated: 3
  writedown: 3
  hedge fund: 1
  yen: 1
  boj: 2
  treasury auction: 2
