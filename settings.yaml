    "^VIX9D": VIX 9日
    "^VIX3M": VIX 3個月
    "^VVIX": VVIX(波動率的波動率)
    "^MOVE": MOVE美債波動率
    "^SKEW": SKEW尾部風險
  europe:
    "^STOXX50E": 歐洲斯托克50
    "^GDAXI": 德國DAX
    "^FTSE": 英國富時100
    "^FCHI": 法國CAC40
    "EUFN": 歐洲金融股
  asia:
    "^N225": 日經225
    "^HSI": 恆生指數
    "000001.SS": 上證綜指
    "^KS11": 韓國KOSPI
    "^TWII": 台灣加權
    "^BSESN": 印度Sensex
    "^AXJO": 澳洲ASX200
    "KWEB": 中概網路
    "EWT": 台灣ETF(美股盤)
    "2330.TW": 台積電(台股)
  emerging:
    "EEM": 新興市場
    "EMB": 新興市場美元債
    "^BVSP": 巴西Bovespa
  rates:
    "^IRX": 美債3個月
    "^FVX": 美債5年
    "^TNX": 美債10年
    "^TYX": 美債30年
    "TLT": 長債ETF
    "IEF": 7-10年美債
    "SHY": 1-3年美債
  credit:
    "HYG": 高收益債
    "JNK": 垃圾債
    "LQD": 投資級債
    "BKLN": 槓桿貸款
    "BIZD": 私募信貸BDC
    "KRE": 區域銀行
    "XLF": 金融股
    "BX": 黑石
    "APO": 阿波羅
