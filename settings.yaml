  rates:
    "^IRX": 美債3個月
    "^FVX": 美債5年
    "^TNX": 美債10年
    "^TYX": 美債30年
    "TLT": 長債ETF
    "IEF": 7-10年美債
    "SHY": 1-3年美債
  credit:
    "HYG": 高收益債
    "JNK": 垃圾債
    "LQD": 投資級債
    "BKLN": 槓桿貸款
    "BIZD": 私募信貸BDC
    "KRE": 區域銀行
    "XLF": 金融股
