# ---------- FRED 總經 / 信用 / 流動性序列 ----------
fred_series:
  BAMLH0A0HYM2: 高收益債利差 OAS
  BAMLC0A0CM: 投資級利差 OAS
  BAMLH0A3HYC: CCC級利差
  T10Y3M: 10年-3個月利差
  T10Y2Y: 10年-2年利差
  DGS2: 2年期殖利率
  DGS10: 10年期殖利率
  DFII10: 10年實質利率
  T10YIE: 10年通膨預期
  NFCI: 芝加哥金融狀況指數
  STLFSI4: 聖路易金融壓力指數
  WALCL: 聯準會資產負債表
  WTREGEN: 財政部TGA帳戶
  RRPONTSYD: 逆回購 RRP
  WRESBAL: 銀行準備金
  SOFR: SOFR
  ICSA: 初領失業金
  UNRATE: 失業率
  SAHMREALTIME: 薩姆衰退指標
  CPIAUCSL: CPI
  DTWEXBGS: 廣義美元指數
  IRLTLT01JPM156N: 日本10年期公債(月)
  IRLTLT01DEM156N: 德國10年期公債(月)

# ---------- 系統性壓力指數 (SSI) 組成 ----------
# kind:
#   level        -> 取序列值本身
#   ret:N        -> N日報酬
#   rel:N:BENCH  -> 相對 BENCH 的 N日超額報酬
#   ratio:B      -> 與 B 的比值
#   diff:N       -> N日差值
#   dist_ma:N    -> 偏離 N日均線
#   corr:N       -> sectors 平均相關係數 (N日)
#   netliq:N     -> 聯準會淨流動性 N日變化
# direction: +1 越高越危險, -1 越低越危險
# 每項都用「自身滾動歷史」算 z-score → 百分位，不設死門檻
stress_components:
  - {id: hy_oas,      block: 信用,      src: fred, series: BAMLH0A0HYM2, kind: level,        direction: 1,  weight: 1.5}
  - {id: ccc_oas,     block: 信用,      src: fred, series: BAMLH0A3HYC,  kind: level,        direction: 1,  weight: 1.0}
  - {id: hyg_ief,     block: 信用,      src: px,   series: HYG,  kind: "rel:20:IEF",          direction: -1, weight: 1.2}
  - {id: bizd,        block: 私募信貸,  src: px,   series: BIZD, kind: "rel:20:SPY",          direction: -1, weight: 0.8}
  - {id: kre,         block: 信用,      src: px,   series: KRE,  kind: "rel:20:SPY",          direction: -1, weight: 1.0}
  - {id: vix_term,    block: 波動率,    src: px,   series: "^VIX", kind: "ratio:^VIX3M",      direction: 1,  weight: 1.5}
  - {id: vix_level,   block: 波動率,    src: px,   series: "^VIX", kind: level,               direction: 1,  weight: 1.0}
  - {id: vvix,        block: 波動率,    src: px,   series: "^VVIX", kind: level,              direction: 1,  weight: 0.6}
  - {id: move,        block: 波動率,    src: px,   series: "^MOVE", kind: level,              direction: 1,  weight: 1.0}
  - {id: nfci,        block: 流動性,    src: fred, series: NFCI,    kind: level,             direction: 1,  weight: 1.0}
  - {id: stlfsi,      block: 流動性,    src: fred, series: STLFSI4, kind: level,             direction: 1,  weight: 1.0}
  - {id: net_liq,     block: 流動性,    src: fred, series: WALCL,   kind: "netliq:63",       direction: -1, weight: 0.8}
  - {id: us2y_drop,   block: 利率,      src: fred, series: DGS2,    kind: "diff:20",         direction: -1, weight: 0.8}
  - {id: curve_steep, block: 利率,      src: fred, series: T10Y3M,  kind: "diff:63",         direction: 1,  weight: 0.6}
  - {id: dxy,         block: 匯率套息,  src: px,   series: "DX-Y.NYB", kind: "ret:20",       direction: 1,  weight: 0.8}
  - {id: yen_carry,   block: 匯率套息,  src: px,   series: "JPY=X",    kind: "ret:10",       direction: -1, weight: 1.0}
  - {id: audjpy,      block: 匯率套息,  src: px,   series: "AUDJPY=X", kind: "ret:10",       direction: -1, weight: 0.8}
  - {id: cnh,         block: 匯率套息,  src: px,   series: "CNY=X",    kind: "ret:20",       direction: 1,  weight: 0.5}
  - {id: spx_trend,   block: 股市結構,  src: px,   series: "^GSPC", kind: "dist_ma:200",      direction: -1, weight: 1.0}
  - {id: breadth,     block: 股市結構,  src: px,   series: RSP,     kind: "rel:60:SPY",       direction: -1, weight: 0.5}
  - {id: correlation, block: 股市結構,  src: px,   series: sectors, kind: "corr:20",          direction: 1,  weight: 0.8}
  - {id: em_debt,     block: 全球新興,  src: px,   series: EMB,     kind: "rel:20:IEF",       direction: -1, weight: 0.7}
  - {id: eu_banks,    block: 全球新興,  src: px,   series: EUFN,    kind: "rel:20:SPY",       direction: -1, weight: 0.6}
  - {id: copper_gold, block: 全球新興,  src: px,   series: "HG=F",  kind: "rel:60:GC=F",      direction: -1, weight: 0.6}
  - {id: oil_shock,   block: 商品加密,  src: px,   series: "BZ=F",  kind: "ret:20",           direction: 1,  weight: 0.5}
  - {id: btc,         block: 商品加密,  src: px,   series: "BTC-USD", kind: "ret:20",         direction: -1, weight: 0.4}
  # ---- 2026/09/30 新增：信用廣度、實質利率、景氣/就業、私募信貸、AI 龍頭、亞洲匯率、避險需求 ----
  - {id: ig_oas,      block: 信用,      src: fred, series: BAMLC0A0CM,  kind: level,         direction: 1,  weight: 0.8}
  - {id: loans,       block: 私募信貸,  src: px,   series: BKLN, kind: "rel:20:IEF",          direction: -1, weight: 0.6}
  - {id: alt_bx,      block: 私募信貸,  src: px,   series: BX,   kind: "rel:20:SPY",          direction: -1, weight: 0.35}
  - {id: alt_apo,     block: 私募信貸,  src: px,   series: APO,  kind: "rel:20:SPY",          direction: -1, weight: 0.35}
  - {id: alt_ares,    block: 私募信貸,  src: px,   series: ARES, kind: "rel:20:SPY",          direction: -1, weight: 0.35}
  - {id: real_yield,  block: 利率,      src: fred, series: DFII10,  kind: "diff:63",         direction: 1,  weight: 0.7}
  - {id: long_bond,   block: 利率,      src: px,   series: "^TYX",  kind: "diff:20",         direction: 1,  weight: 0.5}
  - {id: reserves,    block: 流動性,    src: fred, series: WRESBAL, kind: "diff:63",         direction: -1, weight: 0.5}
  - {id: claims,      block: 景氣就業,  src: fred, series: ICSA,    kind: "ret:63",          direction: 1,  weight: 0.8}
  - {id: sahm,        block: 景氣就業,  src: fred, series: SAHMREALTIME, kind: level,        direction: 1,  weight: 0.8}
  - {id: small_caps,  block: 景氣就業,  src: px,   series: IWM,     kind: "rel:60:SPY",       direction: -1, weight: 0.5}
  - {id: vix_short,   block: 波動率,    src: px,   series: "^VIX9D", kind: "ratio:^VIX",      direction: 1,  weight: 0.6}
  - {id: spx_rvol,    block: 波動率,    src: px,   series: "^GSPC", kind: "rvol:20",          direction: 1,  weight: 0.6}
  - {id: ai_leaders,  block: 股市結構,  src: px,   series: SMH,     kind: "rel:20:SPY",       direction: -1, weight: 0.6}
  - {id: krw,         block: 全球新興,  src: px,   series: "KRW=X", kind: "ret:20",           direction: 1,  weight: 0.5}
  - {id: gold_bid,    block: 商品加密,  src: px,   series: "GC=F",  kind: "rel:20:^GSPC",     direction: 1,  weight: 0.4}

stress_zscore_window: 756   # 3年滾動基準
stress_zscore_min: 252

stress_levels:              # 綜合分數 0-100 標籤
  - {max: 35,  label: 平靜,   emoji: "🟢"}
  - {max: 55,  label: 正常,   emoji: "🟡"}
  - {max: 70,  label: 升溫,   emoji: "🟠"}
  - {max: 85,  label: 高壓,   emoji: "🔴"}
  - {max: 101, label: 極端,   emoji: "🚨"}

# ---------- 崩盤機率（經驗回測） ----------
crash_odds:
  benchmark: "^GSPC"
  horizons:
    - {days: 21, drawdown: 0.05}
    - {days: 63, drawdown: 0.10}
    - {days: 126, drawdown: 0.20}
  buckets: [0, 35, 55, 70, 85, 101]
  momentum:                     # 升溫速度層：SSI 20 日變化對自身歷史的百分位（動態門檻）
    lookback: 20
    rising_pctile: 80           # 20 日變化高於歷史 80 百分位 → 升溫
    falling_pctile: 20          # 低於 20 百分位 → 降溫
    prior_windows: 4            # 樣本少時向「只看水準」的機率收斂的強度

# ---------- 歷史壓力情境（實際歷史價格重播） ----------
stress_scenarios:
  - {name: 2008 雷曼倒閉,     start: "2008-09-12", end: "2008-10-10"}
  - {name: 2011 美債降評,     start: "2011-07-22", end: "2011-08-08"}
  - {name: 2018 Volmageddon,  start: "2018-01-26", end: "2018-02-08"}
  - {name: 2020 疫情崩盤,     start: "2020-02-19", end: "2020-03-23"}
  - {name: 2022 暴力升息,     start: "2022-01-03", end: "2022-06-16"}
  - {name: 2023 矽谷銀行,     start: "2023-03-08", end: "2023-03-13"}
  - {name: 2024 日圓套息拆倉, start: "2024-07-10", end: "2024-08-05"}
  - {name: 2025 關稅衝擊,     start: "2025-04-02", end: "2025-04-08"}

# ---------- 持倉 ----------
portfolio:
  # 情報站模式：enabled=false 時完全不讀取、不分析任何持倉（持倉分析／X 光／停損／集中度皆自動停用）
  # 要恢復個人持倉分析：改成 true 並填入下列檔案路徑（支援 sim_trading.json 或 portfolio_holdings.json）
  enabled: false
  file: ""
  fallback_file: ""
  account_id_env: PRIMARY_PORTFOLIO_USER_ID
  benchmark: SPY
  var_lookback_days: 504

# ---------- 警報規則 ----------
alerts:
  cooldown_minutes: 240
  stress_level_cross: true         # 壓力等級往上跨級
  stress_jump_points: 8            # 綜合分數單日跳升 N 點
  sigma_move: 3.0                  # 任一監控標的單日漲跌超過自身 N 倍標準差
  sigma_move_key_only: false       # true=只看 key_assets
  key_assets: ["^GSPC", "^NDX", "^VIX", "^TNX", "HYG", "JPY=X", "DX-Y.NYB", "BTC-USD", "GC=F", "BZ=F", "^N225", "^TWII", "^HSI", "KRE"]
  vix_backwardation: true          # VIX > VIX3M 期限結構倒掛
  news_score: 8                    # 新聞風險分數 >= N 即推播
  portfolio_drawdown_pct: 3.0      # 持倉單日跌幅 >= N%
  gamma_flip: true                 # SPX 跌破零 gamma 翻轉點

# ---------- 自我監控：資料健康 + 持倉集中度 ----------
health:
  min_coverage: 0.90          # 壓力指數資料涵蓋率低於此值 → 私訊
  grace_minutes: 15           # 重啟後多久才開始檢查資料源
  core_sources: [yahoo_quotes, yahoo_history, fred, cboe_spx]
concentration:
  max_weight_pct: 25          # 單一部位權重上限
  max_risk_contrib_pct: 30    # 單一部位風險貢獻上限
  max_beta: 1.5               # 整體對標普 β 上限
  themes:                     # 主題合計權重上限（同一主題的股票常同漲同跌；可依自己的需求增減）
    半導體:
      max_weight_pct: 40
      tickers: [NVDA, TSM, AVGO, AMD, ASML, MU, AMAT, LRCX, KLAC, QCOM, INTC, TXN, ADI, MRVL, ARM, SMH, SOXX, 2330.TW]
    大型科技:
      max_weight_pct: 50
      tickers: [AAPL, MSFT, GOOGL, GOOG, AMZN, META, NVDA, AVGO, TSLA]

# ---------- 衝擊雷達（下一次金融衝擊會從哪裡點火） ----------
shock:
  divergence_threshold: 15       # 信用/利率/流動性壓力 − 股市隱含恐慌 ≥ N 分 → 背離警示
  credit_blocks: [信用, 私募信貸, 利率, 流動性, 全球新興]
  equity_blocks: [波動率, 股市結構]
  quality_refresh_hours: 6       # 準確度回測的重算間隔

# ---------- 避險計算器 ----------
hedge:
  target_dte: [45, 90]      # 挑最接近的到期日（天）
  otm_pct: [0, 5, 10]       # 價外幅度 %
  shocks_pct: [10, 20]      # 情境：大盤跌幅 %

# ---------- 警報成績單 ----------
scorecard:
  horizons:
    - {days: 5,  drawdown: 0.02}
    - {days: 20, drawdown: 0.04}

# ---------- 華爾街財報季 / 晨會 ----------
street:
  min_mcap_bn: 50          # 市值 ≥ 500 億美元才列入「重要財報」
  per_day: 8
  weekly_board: {weekday: 0, time: "08:05"}   # 每週一 08:05 私訊財報季看板
  watchlist: [AAPL, MSFT, NVDA, GOOGL, AMZN, META, AVGO, TSM, TSLA, AMD, ASML, NFLX,
              JPM, GS, MS, BAC, WFC, V, MA, LLY, UNH, XOM, WMT, COST]

# ---------- 台灣市場 ----------
taiwan:
  refresh_seconds: 7200
  watch_stocks: ["2330", "2317", "2454", "2308", "3711", "2382", "3231", "6669", "2303", "2881"]
  revenue_watch: ["2330", "2454", "2317", "2308", "3711", "2382", "3231", "6669", "2303"]

# ---------- 可靠性 ----------
backup:
  keep: 7                 # 每日備份 sentinel.db 到 data_cache/backups，保留最近幾份

web:
  enabled: true           # true → 只在本機 http://127.0.0.1:8787 開唯讀儀表板（不對外）
  port: 8787

# ---------- 呈現方式 ----------
display:
  mode: slides            # slides=投影片大字圖卡 / classic=傳統 Discord 卡片（也可用 /style 切換）

# ---------- 推播目的地 ----------
# 頻道用 /setchannel 設定；私訊收件人用 /dmme 設定（或 .env 的 OWNER_USER_ID）
# 沒設定任何頻道時，一律改發私訊
delivery:
  dm_briefings: true      # 定時簡報也私訊給我
  dm_alerts: all          # all=全部警報私訊 / critical=只有緊急 / none=不私訊

# ---------- 定時簡報（台北時間） ----------
briefings:
  - {time: "07:30", kind: morning_recap, title: 華爾街晨會｜美股收盤回顧, weekdays: [1,2,3,4,5]}
  - {time: "08:40", kind: taiwan,    title: 台股開盤前籌碼情報, weekdays: [0,1,2,3,4]}
  - {time: "15:30", kind: europe,    title: 歐洲開盤風險掃描, weekdays: [0,1,2,3,4]}
  - {time: "21:00", kind: morning_call, title: 華爾街晨會｜美股開盤前, weekdays: [0,1,2,3,4]}
  - {time: "10:00", kind: weekend,   title: 週末全球風險與加密情報, weekdays: [5,6]}
# weekdays: 0=週一 ... 6=週日（台北時間）

# ---------- 新聞來源 ----------
news_feeds:
  - {name: CNBC,        url: "https://www.cnbc.com/id/100003114/device/rss/rss.html"}
  - {name: CNBC Finance, url: "https://www.cnbc.com/id/10000664/device/rss/rss.html"}
  - {name: MarketWatch, url: "https://feeds.content.dowjones.io/public/rss/mw_topstories"}
  - {name: Bloomberg,   url: "https://feeds.bloomberg.com/markets/news.rss"}
  - {name: Yahoo,       url: "https://finance.yahoo.com/news/rssindex"}
