# ---------- 大師持倉（SEC 13F，每季申報、晚 45 天）與內部人申報（Form 4） ----------
gurus:
  enabled: true
  refresh_hours: 24
  managers:                   # CIK 為 SEC 編號；停止申報的機構會標示最後申報日
    - {cik: 1067983, name: 波克夏（巴菲特）, name_en: "Berkshire Hathaway (Buffett)", style: 價值}
    - {cik: 1649339, name: Scion（Michael Burry，大賣空）, name_en: "Scion (Michael Burry)", style: 放空}
    - {cik: 1336528, name: Pershing Square（Ackman）, name_en: "Pershing Square (Ackman)", style: 集中}
    - {cik: 1536411, name: Duquesne（Druckenmiller）, name_en: "Duquesne (Druckenmiller)", style: 總經}
    - {cik: 1656456, name: Appaloosa（Tepper）, name_en: "Appaloosa (Tepper)", style: 逆勢}
    - {cik: 1079114, name: Greenlight（Einhorn，放空派）, name_en: "Greenlight (Einhorn)", style: 放空}
    - {cik: 1061768, name: Baupost（Klarman）, name_en: "Baupost (Klarman)", style: 價值}
    - {cik: 1350694, name: Bridgewater（Dalio）, name_en: "Bridgewater (Dalio)", style: 總經}
  stale_days: 200             # 最後一份 13F 超過這麼多天 → 標示「已停止申報／資料過期」
insiders:
  enabled: true
  lookback_days: 90
  refresh_hours: 12
  max_fetch_per_run: 250      # 每次最多抓幾份 Form 4（SEC 每秒 ≤10 次請求）；第一次回補約 900 份，會分幾次補完
  big_sale_usd: 25000000      # 單一個股 90 天「非預先計畫」賣出 ≥ 2,500 萬美元 → 列入大額賣股

# ---------- 美債專區 ----------
treasury:
  enabled: true
  refresh_hours: 6
  fred:                       # 殖利率曲線各天期 + 期限溢價（Kim-Wright）
    DGS1MO: 1個月
    DGS3MO: 3個月
    DGS6MO: 6個月
    DGS1: 1年
    DGS2: 2年
    DGS3: 3年
    DGS5: 5年
    DGS7: 7年
    DGS10: 10年
    DGS20: 20年
    DGS30: 30年
    THREEFYTP10: 10年期限溢價
  auction_terms: [2-Year, 3-Year, 5-Year, 7-Year, 10-Year, 20-Year, 30-Year]
  weak_btc_drop: 0.15         # 得標倍數低於同天期近 6 次平均 0.15 以上 → 需求偏弱
  weak_dealer_pp: 5           # 初級交易商承接比例高於近 6 次平均 5 個百分點以上 → 需求偏弱

# ---------- 類股輪動與市場寬度 ----------
breadth:
  sectors: [XLK, XLC, XLY, XLP, XLE, XLV, XLF, XLI, XLU, XLB, XLRE]
  bench: SPY
  windows: {"1週": 5, "1月": 21, "3月": 63, "6月": 126}

# ---------- 時光機（每日快照）與推播 ----------
snapshots:
  min_hour: 6                 # 台北時間幾點後才建立當天快照（美股收盤後）
push:
  darkpool_extreme: true      # 暗池指數 5 日均值進入極端區（≤10 或 ≥90 百分位）時推播
  valuation_change: true      # 估值／信用指標分級變成「極端」「恐慌」時推播
  weak_auction: true          # 公債標售需求偏弱時推播
  breadth_drop: 30            # 美股評分池站上 200 日線比例跌破這個百分比時推播
  guru_new_filing: true       # 追蹤的大師有新 13F 時推播
  insider_big_sale: true      # 評分池個股出現大額非計畫性內部人賣股時推播
  new_signals: true           # 新出現、強度 ≥ signals.push_min_strength 的技術面訊號（每檔每型態每天最多一次）

# ---------- 技術面買點訊號（規則篩選，不是投資建議） ----------
signals:
  enabled: true
  active_days: 3              # 最近幾個交易日內觸發、且尚未失效的訊號都列出
  base: {pullback: 60, breakout: 62, golden: 55, oversold: 45}   # 各型態基礎強度（再依個股評分、量能、風險距離、歷史勝率調整）
  push_min_strength: 70       # Discord 只推播強度 ≥ 70 的「新」訊號
  push_max: 6                 # 每次最多推播幾檔
  picks:                      # ★ 規則精選：每個市場最多標幾檔（全市場為 5 倍）
    n: 3
    min_strength: 65          # 訊號強度門檻
    min_rr: 1.5               # 到 52 週高的空間 ≥ 1.5 倍「到失效線的距離」（已在 52 週高則不限）
    max_risk: 10              # 失效線離現價不超過 10%

# ---------- 全市場掃描（只在網站建置時執行；Discord /stock 可隨時查任一檔） ----------
fullmarket:
  enabled: true
  markets: [us, tw, hk]
  min_mcap_usd: 1000000000    # 美股：市值 ≥ 10 億美元（約 2,500 檔）
  hk_min_turnover: 5000000    # 港股：近 20 日平均成交額 ≥ 500 萬港幣才列入（主板約 800 檔）
  min_turnover: 0             # 美股／台股不另設成交額門檻（台股上市＋上櫃全部）
  budget_s: 420               # 每次建置最多花幾秒抓價格（第一次回補會分好幾次完成）
  budget_share: {us: 0.45, tw: 0.3, hk: 0.25}
  backfill_period: 15mo       # 新加入的個股先抓 15 個月日線（足夠算 200 日線與 12 個月動能）
  chunk_backfill: 60
  chunk_update: 100
  pause_s: 1.0
  keep_bars: 330
  list_days: 7                # 個股清單每 7 天重抓一次
