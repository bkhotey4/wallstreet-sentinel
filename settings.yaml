  制裁: 2
  台海: 4
  熔斷: 5

# ---------- 經濟行事曆（FRED 發布名稱關鍵字） ----------
calendar_releases:
  - Consumer Price Index
  - Employment Situation
  - Gross Domestic Product
  - Personal Income and Outlays
  - Producer Price Index
  - Advance Monthly Sales for Retail
  - Job Openings and Labor Turnover
  - Unemployment Insurance Weekly Claims
  - H.4.1

# ---------- 風險劇本 / 避險失靈偵測 ----------
playbook:
  equity: "^GSPC"
  bond: TLT
  gold: "GC=F"
  corr_window: 60            # 股債相關係數窗口（交易日）
  stock_bond_corr: 0.30      # 相關係數 ≥ 此值 → 債券失去避險功能
  double_kill_days: 3        # 近 20 日『股債雙殺』天數門檻
  haven_fail_pct: 50         # 股票跌≥1% 的日子裡，長債與黃金同跌的比例門檻（%）
  alert_min_stage: 2         # 劇本階段升到此級以上才私訊

# ---------- 特徵實驗室（新指標必須在走步驗證中真的提升準確度才會被採用） ----------
lab:
  min_auc_gain: 0.02          # 樣本外 AUC 至少提升多少才算數
  min_years_improved: 0.6     # 且至少這個比例的年份都有進步（避免只靠少數年份）
  max_features: 3             # 最多採用幾個新特徵（越少越不容易過擬合）

# ---------- 每週復盤（取代獨立的成績單週報；成績單併入其中） ----------
weekly_report: {weekday: 6, time: "20:00"}

# ---------- 持倉 X 光 ----------
xray:
  cluster_corr: 0.70         # 相關係數 ≥ 此值的持股視為同一群（實際上是同一個押注）
  stop_atr_mult: 3.0         # 波動停損線 = 22 日最高收盤 − N × 14 日平均波幅
  vol_target_pct: 25         # 持倉年化波動目標（%）；市場越亂，建議縮減曝險
  stop_alert_min_weight: 3   # 權重 ≥ 此值（%）的持股跌破停損線才警報

# ---------- 情報融合（新聞情報 × 市場價格 × 總經象限） ----------
intel:
  weights: {量化: 0.5, 總經: 0.25, 情報: 0.25}   # 綜合風險的支柱權重（缺資料的支柱自動排除並重新正規化）
  market_weight: 0.65          # 每條傳導路徑的融合分數：價格(衝擊雷達點火) 65% + 新聞熱度 35%
  half_life_hours: 12          # 新聞衰減半衰期
  baseline_days: 30            # 新聞熱度和自身多少天的歷史比較
  min_baseline: 48             # 至少幾筆快照（每 30 分鐘一筆 → 約 1 天）才改用百分位
  record_every_minutes: 30
  warmup_heat_scale: 5         # 基準不足時，絕對熱度 → 0-100 的飽和尺度
  news_warm_count: 5           # ≥5 則風險新聞至少算「溫」（不會被判成新聞安靜）
  news_hot: 80                 # 新聞熱度 ≥80（且 ≥2 則）= 熱
  news_warm: 60
  confirm_bonus: 4             # 每條『確認』路徑加分（新聞與價格同時示警）
  confirm_bonus_cap: 8
  quadrant_edge_z: 0.3         # 成長/通膨 z 在 ±0.3 內 → 觀察清單提示象限可能轉換
  alert_min_label: 高          # 綜合風險升到這一級才推播
  alert_quadrant_change: true
  # channels: 可覆寫各傳導路徑的關鍵字 {路徑名: {risk: [...], relief: [...]}}，路徑名需與衝擊雷達一致
